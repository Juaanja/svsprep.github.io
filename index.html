    let currentLang = "es";
    let occupiedTimes = { lunes: [], martes: [], jueves: [] };

    // Cargar horas reservadas desde Apps Script
    async function initTimeSelectors() {
      try {
        const res = await fetch(SCRIPT_URL);
        if (res.ok) {
          occupiedTimes = await res.json();
        }
      } catch (err) {
        console.warn("No se pudo obtener la lista de horas ocupadas.", err);
      }
      renderTimeOptions();
    }

    function renderTimeOptions() {
      const t = translations[currentLang];
      const selects = [
        { id: "horaLunes", list: occupiedTimes.lunes || [] },
        { id: "horaMartes", list: occupiedTimes.martes || [] },
        { id: "horaJueves", list: occupiedTimes.jueves || [] }
      ];

      selects.forEach(({ id, list }) => {
        const el = document.getElementById(id);
        const currentVal = el.value;
        el.innerHTML = `<option value="No participa">${t.noParticipate}</option>`;

        for (let h = 0; h < 24; h++) {
          for (let m = 0; m < 60; m += 30) {
            const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            const isTaken = list.includes(timeStr);

            if (isTaken) {
              el.innerHTML += `<option value="${timeStr}" disabled>${timeStr} (${t.taken})</option>`;
            } else {
              el.innerHTML += `<option value="${timeStr}">${timeStr}</option>`;
            }
          }
        }
        if (currentVal) el.value = currentVal;
      });
    }

    // Sincronización automática de horarios
    document.getElementById("horaLunes").addEventListener("change", (e) => {
      if (document.getElementById("syncSchedule").checked) {
        syncAll(e.target.value);
      }
    });

    document.getElementById("syncSchedule").addEventListener("change", (e) => {
      if (e.target.checked) {
        syncAll(document.getElementById("horaLunes").value);
      }
    });

    function syncAll(val) {
      ["horaMartes", "horaJueves"].forEach(id => {
        const select = document.getElementById(id);
        const opt = select.querySelector(`option[value="${val}"]`);
        if (opt && !opt.disabled) {
          select.value = val;
        }
      });
    }

    // Cambio dinámico de idioma
    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById("t-title").textContent = t.title;
      document.getElementById("t-playerName").textContent = t.playerName;
      document.getElementById("jugador").placeholder = t.playerPlaceholder;
      document.getElementById("t-fireCrystal").textContent = t.fireCrystal;
      document.getElementById("t-refined").textContent = t.refined;
      document.getElementById("t-fragments").textContent = t.fragments;
      document.getElementById("t-speedupsHeader").textContent = t.speedupsHeader;
      document.getElementById("t-general").textContent = t.general;
      document.getElementById("t-training").textContent = t.training;
      document.getElementById("t-construction").textContent = t.construction;
      document.getElementById("t-research").textContent = t.research;
      document.getElementById("t-scheduleHeader").textContent = t.scheduleHeader;
      document.getElementById("t-syncLabel").textContent = t.syncLabel;
      document.getElementById("t-mon").textContent = t.mon;
      document.getElementById("t-tue").textContent = t.tue;
      document.getElementById("t-thu").textContent = t.thu;
      document.getElementById("submitBtn").textContent = t.submit;

      ["es", "en", "fr", "de", "ru", "ko", "pl"].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (btn) {
          btn.className = (l === lang) 
            ? "px-2 py-1 text-xs rounded font-bold transition bg-sky-500 text-slate-950" 
            : "px-2 py-1 text-xs rounded font-bold transition text-slate-400 hover:text-white";
        }
      });

      renderTimeOptions();
    }

    let selectedAlliance = "";
    document.querySelectorAll(".alliance-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".alliance-btn").forEach(b => b.classList.remove("badge-selected"));
        btn.classList.add("badge-selected");
        selectedAlliance = btn.getAttribute("data-val");
      });
    });

    function stepVal(id, amount) {
      const input = document.getElementById(id);
      let val = parseInt(input.value) || 0;
      val = Math.max(0, val + amount);
      input.value = val;
    }

    document.getElementById("savingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = translations[currentLang];

      if (!selectedAlliance) {
        alert(t.alertAlliance);
        return;
      }

      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msgStatus");

      btn.disabled = true;
      btn.textContent = t.sending;

      const payload = {
        jugador: document.getElementById("jugador").value,
        alianza: selectedAlliance,
        cristalFuego: document.getElementById("cristalFuego").value,
        refinado: document.getElementById("refinado").value,
        fragmentos: document.getElementById("fragmentos").value,
        acelGeneral: document.getElementById("acelGeneral").value,
        acelEntrenamiento: document.getElementById("acelEntrenamiento").value,
        acelConstruccion: document.getElementById("acelConstruccion").value,
        acelInvestigacion: document.getElementById("acelInvestigacion").value,
        horaLunes: document.getElementById("horaLunes").value,
        horaMartes: document.getElementById("horaMartes").value,
        horaJueves: document.getElementById("horaJueves").value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        msg.textContent = t.success;
        msg.className = "text-center text-xs font-semibold text-emerald-400 block";
        document.getElementById("savingsForm").reset();
        document.querySelectorAll(".badge-selected").forEach(b => b.classList.remove("badge-selected"));
        selectedAlliance = "";
        
        // Recarga los horarios ocupados inmediatamente tras el envío
        initTimeSelectors();
      } catch (err) {
        msg.textContent = t.error;
        msg.className = "text-center text-xs font-semibold text-rose-400 block";
      } finally {
        btn.disabled = false;
        btn.textContent = t.submit;
      }
    });

    initTimeSelectors();
  </script>
</body>
</html>
